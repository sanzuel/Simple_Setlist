workflows:
  android-release:
    name: SongSetlist Android Release
    max_build_duration: 30
    environment:
      groups:
        - keystore_credentials
      vars:
        PACKAGE_NAME: "com.songsetlist.app"
      android_signing:
        - songsetlist_keystore
    scripts:
      - name: Build release APK
        script: |
          chmod +x gradlew
          ./gradlew assembleRelease
    artifacts:
      - app/build/outputs/apk/release/app-release.apk
