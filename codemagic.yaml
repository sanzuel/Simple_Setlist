workflows:
  android-release:
    name: Simple_Setlist Android Release
    max_build_duration: 30

    environment:
      groups:
        - keystore_credentials

    scripts:
      - name: Build release APK
        script: |
          chmod +x gradlew
          ./gradlew assembleRelease

    artifacts:
      - app/build/outputs/apk/release/*.apk